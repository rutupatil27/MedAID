name: medaid
description: "MedAID — emergency health assistance for large gatherings."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0

  # Networking & storage
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5

  # Localization (version pinned by flutter_localizations)
  intl: any

  # Maps & location (OpenStreetMap)
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.3

  # System notifications with sound when an assignment arrives (local, no service needed).
  flutter_local_notifications: ^22.3.1

  # Push notifications (FCM, doc 19). Inactive unless built with ENABLE_PUSH.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

  # Files & external actions
  file_picker: ^13.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  # The emergency ring is not a Flutter asset: Android plays it from
  # android/app/src/main/res/raw/emergency_ring.wav, so it still sounds when the
  # app is not running and no Dart code exists to play it.

  # Poppins covers Latin + Devanagari (Hindi/Marathi). Bundled, never fetched at runtime.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
