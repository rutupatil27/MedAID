org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin 2.3's compiler daemon fails to close its incremental caches while
# building the Flutter plugin modules on Windows, which breaks the build
# ("Could not close incremental caches in build/android_file_picker/..").
# Compiling in the Gradle process without incremental caches is a little
# slower but works; revisit when the Kotlin plugin is upgraded.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
